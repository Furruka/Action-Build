name: Reno12 6.12 baseline (A/B/C)

on:
  workflow_dispatch:
  push:
    branches: [reno12-6.12-baseline]

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      KERNEL_VERSION: kernel-6.12
      KLEAF_VERSION_FLAG: --//build/bazel_mgk_rules:kernel_version=6.12
      KLEAF_EMBED_FLAG: --//build/kernel/kleaf:defconfig_fragment=//kernel_device_modules-6.12:kernel/configs/qqcandy-embed.config
      KLEAF_DISPLAY_FLAG: --define=CONFIG_TRUSTONIC_TEE_SUPPORT=n
      RECOVERY_MODULES_TARGET: //qqcandy_recovery:qqcandy_recovery_modules_install
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: free disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h / | tail -1

      - name: env + repo
        run: |
          set -o pipefail
          nproc; free -g | head -2; df -h / | tail -1
          sudo apt-get update -qq && sudo apt-get install -y -qq git python3 curl unzip zip kmod device-tree-compiler
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo; echo "$HOME/bin" >> $GITHUB_PATH

      - name: A1 init + local manifest
        run: |
          set -eo pipefail
          mkdir -p $RUNNER_TEMP/ws && cd $RUNNER_TEMP/ws
          repo init -u https://github.com/Numbersf/Kernel_Manifest_Appendix -b oppo/mt6896 -m oppo_reno12_b.xml --depth=1 --no-repo-verify 2>&1 | tail -5
          mkdir -p .repo/local_manifests
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<manifest>'
            echo '  <remove-project name="kernel_platform/prebuilts/asuite" />'
            echo '  <remove-project name="kernel_platform/tools/tradefederation/prebuilts" />'
            echo '</manifest>'
          } > .repo/local_manifests/remove-bad.xml
          cat .repo/local_manifests/remove-bad.xml

      - name: A2 sync
        run: |
          set -o pipefail
          cd $RUNNER_TEMP/ws
          repo sync -c -j8 --no-clone-bundle --no-tags --force-sync 2>&1 | tee sync.log | tail -20
          echo "--- sync errors:"; grep -c "SyncError\|SyncFailFastError" sync.log || true
          df -h / | tail -1; du -sh . | tail -1

      - name: A3 layout + py3-cmd provenance
        run: |
          set -eo pipefail
          cd $RUNNER_TEMP/ws
          for p in kernel kernel-6.12 kernel_platform kernel_platform/common \
                   kernel/kernel_device_modules-6.12 \
                   kernel/prebuilts/build-tools \
                   kernel_platform/prebuilts/kernel-build-tools \
                   kernel_platform/prebuilts/clang/host/linux-x86 \
                   kernel/tools/bazel kernel/build/kernel/kleaf/bazel.origin.sh; do
            [ -e "$p" ] && echo "EXIST   $p" || echo "MISSING $p"
          done | tee layout.log
          find kernel_platform/prebuilts/kernel-build-tools -maxdepth 4 -name py3-cmd 2>/dev/null | head -3 | tee -a layout.log

      - name: A4 bind-mount prebuilts/external into the workspace
        run: |
          set -eo pipefail
          cd $RUNNER_TEMP/ws
          echo '--- kernel top (before) ---'
          ls -la kernel | head -20
          echo '--- kernel/prebuilts kernel/build kernel/tools kernel/external ---'
          ls -la kernel/prebuilts kernel/build kernel/tools kernel/external 2>/dev/null | head -30 || true
          sudo rm -rf kernel/prebuilts kernel/external
          mkdir -p kernel/prebuilts kernel/external
          sudo mount --bind kernel_platform/prebuilts kernel/prebuilts
          sudo mount --bind kernel_platform/external kernel/external
          mkdir -p kernel/build/bazel_common_rules
          sudo mount --bind kernel_platform/build/bazel_common_rules kernel/build/bazel_common_rules 2>/dev/null || true
          echo '--- kernel/prebuilts after mount ---'
          ls kernel/prebuilts | head -20
          ls -l kernel/prebuilts/build-tools/linux_musl-x86/bin/py3-cmd 2>/dev/null || echo NO_MUSL
          ls -l kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel 2>/dev/null || echo NO_BAZEL_BIN
          sysroot="$PWD/kernel_platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/sysroot"
          echo "Host glibc sysroot: $sysroot"
          test -r "$sysroot/usr/include/linux/types.h"
          for build_tools in kernel/build/kernel/build-tools kernel/build/build-tools; do
            mkdir -p "$build_tools"
            rm -rf "$build_tools/sysroot"
            cp -a "$sysroot" "$build_tools/sysroot"
          done
          ls kernel/external | head -15
      - name: A5 apply qqcandy patches to the Kleaf source tree
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ws"
          exec > >(tee a5.log) 2>&1
          core="$(realpath -e kernel/kernel-6.12)"
          modules="$(realpath -e kernel/kernel_device_modules-6.12)"
          patch="$GITHUB_WORKSPACE/ci-patches/0001-v3d.patch"
          fdt_fix="$GITHUB_WORKSPACE/ci-patches/0002-v3e-fdt-state.patch"
          init_fix="$GITHUB_WORKSPACE/ci-patches/0003-v3f-init-sections.patch"
          usb_headers="$GITHUB_WORKSPACE/ci-patches/0004-usb-ddk-headers.patch"
          pinctrl_headers="$GITHUB_WORKSPACE/ci-patches/0005-pinctrl-ddk-eint-header.patch"
          tianma_panel="$GITHUB_WORKSPACE/ci-patches/0006-qqcandy-tianma-panel.patch"
          drm_headers="$GITHUB_WORKSPACE/ci-patches/0007-qqcandy-drm-ddk-headers.patch"
          drm_providers="$GITHUB_WORKSPACE/ci-patches/0008-qqcandy-drm-devapc-provider.patch"
          typec_order="$GITHUB_WORKSPACE/ci-patches/0009-qqcandy-typec-recovery-order.patch"
          usb_probe="$GITHUB_WORKSPACE/ci-patches/0010-qqcandy-usb-provider-probe.patch"
          supplier_headers="$GITHUB_WORKSPACE/ci-patches/0011-qqcandy-drm-supplier-headers.patch"
          dsi_drm="$GITHUB_WORKSPACE/ci-patches/0012-qqcandy-drm-dsi-no-tee.patch"
          dvfsrc_headers="$GITHUB_WORKSPACE/ci-patches/0013-qqcandy-dvfsrc-ddk-headers.patch"
          dsi_conditional="$GITHUB_WORKSPACE/ci-patches/0014-qqcandy-dsi-ddk-conditional-source.patch"
          lk_dramc="$GITHUB_WORKSPACE/ci-patches/0015-qqcandy-merge-lk-dramc.patch"
          dramc_probe="$GITHUB_WORKSPACE/ci-patches/0016-qqcandy-dramc-publish-after-probe.patch"
          display_probe="$GITHUB_WORKSPACE/ci-patches/0017-qqcandy-display-probe-readiness.patch"
          xsphy_procfs="$GITHUB_WORKSPACE/ci-patches/0018-qqcandy-xsphy-procfs-lifetime.patch"
          charger_publish="$GITHUB_WORKSPACE/ci-patches/0019-qqcandy-mt6375-charger-publication.patch"
          lk_emicen="$GITHUB_WORKSPACE/ci-patches/0020-qqcandy-merge-lk-emicen.patch"
          project_data="$GITHUB_WORKSPACE/ci-patches/0021-qqcandy-oplus-project-optional-data.patch"
          tcpc_register="$GITHUB_WORKSPACE/ci-patches/0022-qqcandy-tcpc-registration-lifetime.patch"
          fragment="$GITHUB_WORKSPACE/ci-files/qqcandy-embed.config"
          printf 'Workflow commit %s\nKleaf kernel tree %s\nDevice modules tree %s\n' "$GITHUB_SHA" "$core" "$modules"
          git -C "$core" rev-parse HEAD
          git -C "$modules" rev-parse HEAD
          test "$(realpath -e "$(git -C "$core" rev-parse --show-toplevel)")" = "$core"
          sha256sum "$patch" "$fdt_fix" "$init_fix" "$usb_headers" "$pinctrl_headers" \
            "$tianma_panel" "$drm_headers" "$drm_providers" "$typec_order" "$usb_probe" "$supplier_headers" \
            "$dsi_drm" "$dvfsrc_headers" "$dsi_conditional" "$lk_dramc" "$dramc_probe" "$display_probe" \
            "$xsphy_procfs" "$charger_publish" "$lk_emicen" "$project_data" "$tcpc_register" \
            "$fragment" "$GITHUB_WORKSPACE/ci-files/board-embed.dtb"
          git -C "$core" apply --check --verbose "$patch"
          git -C "$core" apply --verbose "$patch"
          git -C "$core" apply --check --verbose "$fdt_fix"
          git -C "$core" apply --verbose "$fdt_fix"
          git -C "$core" apply --check --verbose "$init_fix"
          git -C "$core" apply --verbose "$init_fix"
          git -C "$core" apply --check --verbose "$lk_dramc"
          git -C "$core" apply --verbose "$lk_dramc"
          git -C "$core" apply --check --verbose "$lk_emicen"
          git -C "$core" apply --verbose "$lk_emicen"
          git -C "$core" apply --check --verbose "$usb_headers"
          git -C "$core" apply --verbose "$usb_headers"
          modules_repo="$(git -C "$modules" rev-parse --show-toplevel)"
          git -C "$modules_repo" apply --check --verbose "$pinctrl_headers"
          git -C "$modules_repo" apply --verbose "$pinctrl_headers"
          git -C "$modules_repo" apply --check --verbose "$tianma_panel"
          git -C "$modules_repo" apply --verbose "$tianma_panel"
          git -C "$modules_repo" apply --check --verbose "$drm_headers"
          git -C "$modules_repo" apply --verbose "$drm_headers"
          git -C "$modules_repo" apply --check --verbose "$drm_providers"
          git -C "$modules_repo" apply --verbose "$drm_providers"
          git -C "$modules_repo" apply --check --verbose "$typec_order"
          git -C "$modules_repo" apply --verbose "$typec_order"
          git -C "$modules_repo" apply --check --verbose "$usb_probe"
          git -C "$modules_repo" apply --verbose "$usb_probe"
          git -C "$modules_repo" apply --check --verbose "$supplier_headers"
          git -C "$modules_repo" apply --verbose "$supplier_headers"
          git -C "$modules_repo" apply --check --verbose "$dsi_drm"
          git -C "$modules_repo" apply --verbose "$dsi_drm"
          git -C "$modules_repo" apply --check --verbose "$dvfsrc_headers"
          git -C "$modules_repo" apply --verbose "$dvfsrc_headers"
          git -C "$modules_repo" apply --check --verbose "$dsi_conditional"
          git -C "$modules_repo" apply --verbose "$dsi_conditional"
          git -C "$modules_repo" apply --check --verbose "$dramc_probe"
          git -C "$modules_repo" apply --verbose "$dramc_probe"
          git -C "$modules_repo" apply --check --verbose "$display_probe"
          git -C "$modules_repo" apply --verbose "$display_probe"
          git -C "$modules_repo" apply --check --verbose "$xsphy_procfs"
          git -C "$modules_repo" apply --verbose "$xsphy_procfs"
          git -C "$modules_repo" apply --check --verbose "$charger_publish"
          git -C "$modules_repo" apply --verbose "$charger_publish"
          git -C "$modules_repo" apply --check --verbose "$project_data"
          git -C "$modules_repo" apply --verbose "$project_data"
          git -C "$modules_repo" apply --check --verbose "$tcpc_register"
          git -C "$modules_repo" apply --verbose "$tcpc_register"
          git -C "$core" status --short
          grep -F 'static struct mfdt_ctx ctx __initdata' "$core/arch/arm64/kernel/mtk_embed_merge.c"
          grep -Fx 'config MTK_EMBED_BOARD_DTB' "$core/arch/arm64/Kconfig"
          dtb="$core/arch/arm64/boot/dts/mediatek/qqcandy-merged.dtb"
          install -D -m 644 "$GITHUB_WORKSPACE/ci-files/board-embed.dtb" "$dtb"
          dsi=/soc/dsi@14017000
          host_ep="$dsi/ports/port/endpoint"
          tianma="$dsi/panel7@0"
          panel_ep="$tianma/port/endpoint"
          test "$(fdtget -t s "$dtb" /odm/oplus_boardid oplus_boardid,dtsino)" = 22801
          test "$(fdtget -t s "$dtb" "$dsi" status)" = okay
          test "$(fdtget -t s "$dtb" "$tianma" compatible)" = 'oplus21143,tianma,nt36672c,vdo'
          host_phandle="$(fdtget -t x "$dtb" "$host_ep" phandle)"
          panel_phandle="$(fdtget -t x "$dtb" "$panel_ep" phandle)"
          test "$(fdtget -t x "$dtb" "$host_ep" remote-endpoint)" = "$panel_phandle"
          test "$(fdtget -t x "$dtb" "$panel_ep" remote-endpoint)" = "$host_phandle"
          test "$(fdtget -t s "$dtb" "$dsi/panel6@0" status)" = disabled
          echo 'Verified reciprocal MT6895 DSI0 graph for the 22801 Tianma NT36672C panel'
          install -m 644 "$fragment" "$modules/kernel/configs/qqcandy-embed.config"
          printf '\nexports_files(["kernel/configs/qqcandy-embed.config"])\n' >> "$modules/BUILD.bazel"
          device_defconfig="$modules/arch/arm64/configs/mgk_64_k612_defconfig"
          # DRM depends on the OPLUS project-info DDK module's MediaTek sources.
          if ! grep -Fxq 'CONFIG_OPLUS_DDK_MTK=y' "$device_defconfig"; then
            printf '\nCONFIG_OPLUS_DDK_MTK=y\n' >> "$device_defconfig"
          fi
          # The public module tree omits the optional OPLUS voice-wake monitor.
          # Its two unconditional imports otherwise stop all device configurations.
          if [ ! -f "$modules/drivers/soc/oplus/oplus_vow_monitor/Kconfig" ]; then
            monitor_source='source "$(KCONFIG_EXT_PREFIX)drivers/soc/oplus/oplus_vow_monitor/Kconfig"'
            for kconfig in "$modules/drivers/misc/mediatek/vow/Kconfig" "$modules/sound/soc/codecs/Kconfig"; do
              grep -Fx -- "$monitor_source" "$kconfig"
              grep -Fvx -- "$monitor_source" "$kconfig" > "$kconfig.qqcandy"
              mv "$kconfig.qqcandy" "$kconfig"
            done
          fi
          sha256sum "$core/arch/arm64/kernel/mtk_embed_merge.c" "$dtb"

      - name: Check the recovery module build graph and device configuration
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ws/kernel"
          mkdir -p qqcandy_recovery
          install -m 644 "$GITHUB_WORKSPACE/ci-files/qqcandy-recovery.BUILD.bazel" qqcandy_recovery/BUILD.bazel
          ./tools/bazel build "$KLEAF_VERSION_FLAG" "$KLEAF_EMBED_FLAG" "$KLEAF_DISPLAY_FLAG" --nobuild \
            "$RECOVERY_MODULES_TARGET" 2>&1 | tee ../recovery_analysis.log
          ./tools/bazel build "$KLEAF_VERSION_FLAG" "$KLEAF_EMBED_FLAG" "$KLEAF_DISPLAY_FLAG" \
            //kernel_device_modules-6.12:mgk_64_k612.user_config 2>&1 | tee ../device_config_build.log
          device_config_dir=bazel-bin/kernel_device_modules-6.12/mgk_64_k612.user_config/out_dir
          grep -Fx 'CONFIG_OPLUS_DDK_MTK=y' "$device_config_dir/.config"

      - name: B and C build configuration and verify the linked DTB
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ws/kernel"
          package=kernel_device_modules-6.12
          image_target=mgk_64_k612_kernel_aarch64.user
          target="//$package:$image_target"
          flags=("$KLEAF_VERSION_FLAG" "$KLEAF_EMBED_FLAG" "$KLEAF_DISPLAY_FLAG")
          printf 'Target: %s\n' "$target"
          printf 'Bazel option: %s\n' "${flags[@]}"

          config_action='inputs(".*qqcandy-embed[.]config", mnemonic("^KernelConfig$", '
          ./tools/bazel aquery "${flags[@]}" --include_artifacts=false \
            "$config_action${target}_config))" | tee ../config_action.log
          grep -F 'Mnemonic: KernelConfig' ../config_action.log

          ./tools/bazel build "${flags[@]}" "${target}_config" 2>&1 | tee ../config_build.log
          ./tools/bazel cquery "${flags[@]}" --output=files "${target}_config" | tee ../config_outputs.log
          out_dir="$(awk -v suffix="/$package/${image_target}_config/out_dir" 'substr($0, 1 + length($0) - length(suffix)) == suffix' ../config_outputs.log)"
          test -f "$out_dir/.config"
          cp "$out_dir/.config" ../kernel-config.txt
          grep -E '^(CONFIG_MTK_EMBED|CONFIG_ARCH_MEDIATEK|CONFIG_USB_(MTU3|XHCI_MTK|GADGET|CONFIGFS_F_FS)=|CONFIG_PSTORE_RAM=|# CONFIG_ARCH_MEDIATEK)' ../kernel-config.txt | tee ../config_symbols.log
          while IFS= read -r setting; do
            grep -Fx -- "$setting" ../kernel-config.txt
          done < "$GITHUB_WORKSPACE/ci-files/qqcandy-embed.config"

          image_action='inputs(".*qqcandy-merged[.]dtb", mnemonic("^KernelBuild$", '
          ./tools/bazel aquery "${flags[@]}" --include_artifacts=false \
            "$image_action$target))" | tee ../image_action.log
          grep -F 'Mnemonic: KernelBuild' ../image_action.log

          ./tools/bazel build "${flags[@]}" "$target" 2>&1 | tee ../bazel_build.log
          ./tools/bazel cquery "${flags[@]}" --output=files "$target" | tee ../image_outputs.log
          image="$(awk -v suffix="/$package/$image_target/Image" 'substr($0, 1 + length($0) - length(suffix)) == suffix' ../image_outputs.log)"
          test -f "$image"
          vmlinux="$(dirname "$image")/vmlinux"
          test -f "$vmlinux"
          python3 "$GITHUB_WORKSPACE/ci-files/check_embed.py" "$image" \
            "$GITHUB_WORKSPACE/ci-files/board-embed.dtb" | tee ../embed_check.log
          nm "$vmlinux" | awk '$3 ~ /^_binary_arch_arm64_kernel_board_embed_dtb_(start|end)$/ {print}' | tee ../vmlinux_symbols.log
          grep -q ' _binary_arch_arm64_kernel_board_embed_dtb_start$' ../vmlinux_symbols.log
          grep -q ' _binary_arch_arm64_kernel_board_embed_dtb_end$' ../vmlinux_symbols.log

      - name: upload verified Images
        uses: actions/upload-artifact@v4
        with:
          name: reno12-images
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ws/kernel/bazel-bin/kernel_device_modules-6.12/mgk_64_k612_kernel_aarch64.user/Image*

      - name: D build the same-kernel USB and DRM modules and run depmod
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ws/kernel"
          flags=("$KLEAF_VERSION_FLAG" "$KLEAF_EMBED_FLAG" "$KLEAF_DISPLAY_FLAG")
          device_target=//kernel_device_modules-6.12:mgk_64_k612.user
          ./tools/bazel build "${flags[@]}" --keep_going "$RECOVERY_MODULES_TARGET" 2>&1 | tee ../recovery_build.log
          if grep -iE 'needs unknown symbol|disagrees about version|depmod: ERROR' ../recovery_build.log; then
            echo 'The recovery module set has unresolved symbols' >&2
            exit 1
          fi
          ./tools/bazel cquery "${flags[@]}" --output=files "$RECOVERY_MODULES_TARGET" | tee ../recovery_outputs.log
          deps="$(awk '/\/qqcandy_recovery\/qqcandy_recovery_modules_install\/modules[.]dep$/ {print}' ../recovery_outputs.log)"
          test -s "$deps"
          ./tools/bazel cquery "${flags[@]}" --output_groups=+modules_staging_archive --output=files "$device_target" | tee ../device_outputs.log
          base_archive="$(awk '/\/mgk_64_k612[.]user\/modules_staging_dir[.]tar[.]gz$/ {print}' ../device_outputs.log)"
          test -s "$base_archive"
          stage=../qqcandy-recovery-modules
          mkdir -p "$stage"
          # A cached output directory can still contain files an older target declared.
          mapfile -t module_outputs < <(awk -v dir="$(dirname "$deps")/" 'index($0, dir) == 1 {print}' ../recovery_outputs.log)
          test "${#module_outputs[@]}" -gt 0
          cp -L -- "${module_outputs[@]}" "$base_archive" "$stage/"
          for module in mediatek-drm.ko oplus21143_tianma_nt36672c_dsi_vdo.ko \
            mt6375-adc.ko mtk_chg_type_det.ko tcpci_late_sync.ko mtk_wdt.ko \
            mtk-dvfsrc.ko mtk-dvfsrc-regulator.ko mtk-dvfsrc-devfreq.ko mtk-emi.ko \
            clk-mt6895-img.ko clk-mt6895-vcodec.ko clk-mt6895-cam.ko clk-mt6895-ccu.ko; do
            test -s "$stage/$module"
          done
          test ! -e "$stage/mcDrvModule.ko"
          nm -u "$stage/mediatek-drm.ko" > ../drm_undefined_symbols.log
          if grep -iEq '[[:space:]]teec_' ../drm_undefined_symbols.log; then
            echo 'The DSI build still imports the external display TEE backend' >&2
            exit 1
          fi
          tar tf "$stage/modules_staging_dir.tar.gz" > ../device_archive_files.log
          release="$(sed -E 's|^[.]/||' ../device_archive_files.log | awk -F/ '$1 == "lib" && $2 == "modules" && $3 != "" {print $3}' | sort -u)"
          test -n "$release"
          for module in "$stage"/*.ko; do
            vermagic="$(modinfo -F vermagic "$module")"
            printf '%s %s\n' "$(basename "$module")" "$vermagic"
            test "${vermagic%% *}" = "$release"
          done | tee ../recovery_vermagic.log
          sha256sum "$stage"/* | tee ../recovery_sha256.log

      - name: upload USB and DRM build inputs for recovery packaging
        uses: actions/upload-artifact@v4
        with:
          name: qqcandy-recovery-modules
          if-no-files-found: error
          path: ${{ runner.temp }}/ws/qqcandy-recovery-modules/

      - name: first error extraction
        if: always()
        run: |
          cd $RUNNER_TEMP/ws || exit 0
          : > first_error.log
          for f in sync.log a5.log recovery_analysis.log device_config_build.log config_build.log bazel_build.log recovery_build.log; do
            [ -f "$f" ] || continue
            echo "### $f" >> first_error.log
            if match="$(grep -n -m1 -iE 'No such file|error:|couldn.t find|FAILED:' "$f")"; then
              line_number=${match%%:*}
              start=$((line_number > 10 ? line_number - 10 : 1))
              sed -n "${start},$((line_number + 20))p" "$f" >> first_error.log
            else
              echo "(none)" >> first_error.log
            fi
          done
          cat first_error.log

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reno12-logs
          path: |
            ${{ runner.temp }}/ws/*.log
            ${{ runner.temp }}/ws/kernel-config.txt
