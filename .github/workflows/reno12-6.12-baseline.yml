name: Reno12 6.12 baseline (A/B/C)

on:
  workflow_dispatch:
  push:
    branches: [reno12-6.12-baseline]

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      KERNEL_VERSION: kernel-6.12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: free disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h / | tail -1

      - name: env + repo
        run: |
          set -o pipefail
          nproc; free -g | head -2; df -h / | tail -1
          sudo apt-get update -qq && sudo apt-get install -y -qq git python3 curl unzip zip
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo; echo "$HOME/bin" >> $GITHUB_PATH

      - name: A1 init + local manifest
        run: |
          set -eo pipefail
          mkdir -p $RUNNER_TEMP/ws && cd $RUNNER_TEMP/ws
          repo init -u https://github.com/Numbersf/Kernel_Manifest_Appendix -b oppo/mt6896 -m oppo_reno12_b.xml --depth=1 --no-repo-verify 2>&1 | tail -5
          mkdir -p .repo/local_manifests
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<manifest>'
            echo '  <remove-project name="kernel_platform/prebuilts/asuite" />'
            echo '  <remove-project name="kernel_platform/tools/tradefederation/prebuilts" />'
            echo '</manifest>'
          } > .repo/local_manifests/remove-bad.xml
          cat .repo/local_manifests/remove-bad.xml

      - name: A2 sync
        run: |
          set -o pipefail
          cd $RUNNER_TEMP/ws
          repo sync -c -j8 --no-clone-bundle --no-tags --force-sync 2>&1 | tee sync.log | tail -20
          echo "--- sync errors:"; grep -c "SyncError\|SyncFailFastError" sync.log || true
          df -h / | tail -1; du -sh . | tail -1

      - name: A3 layout + py3-cmd provenance
        run: |
          set -eo pipefail
          cd $RUNNER_TEMP/ws
          for p in kernel kernel-6.12 kernel_platform kernel_platform/common \
                   kernel/kernel_device_modules-6.12 \
                   kernel/prebuilts/build-tools \
                   kernel_platform/prebuilts/kernel-build-tools \
                   kernel_platform/prebuilts/clang/host/linux-x86 \
                   kernel/tools/bazel kernel/build/kernel/kleaf/bazel.origin.sh; do
            [ -e "$p" ] && echo "EXIST   $p" || echo "MISSING $p"
          done | tee layout.log
          find kernel_platform/prebuilts/kernel-build-tools -maxdepth 4 -name py3-cmd 2>/dev/null | head -3 | tee -a layout.log

      - name: A4 bind-mount prebuilts/external into the workspace
        run: |
          set -eo pipefail
          cd $RUNNER_TEMP/ws
          echo '--- kernel top (before) ---'
          ls -la kernel | head -20
          echo '--- kernel/prebuilts kernel/build kernel/tools kernel/external ---'
          ls -la kernel/prebuilts kernel/build kernel/tools kernel/external 2>/dev/null | head -30 || true
          sudo rm -rf kernel/prebuilts kernel/external
          mkdir -p kernel/prebuilts kernel/external
          sudo mount --bind kernel_platform/prebuilts kernel/prebuilts
          sudo mount --bind kernel_platform/external kernel/external
          mkdir -p kernel/build/bazel_common_rules
          sudo mount --bind kernel_platform/build/bazel_common_rules kernel/build/bazel_common_rules 2>/dev/null || true
          echo '--- kernel/prebuilts after mount ---'
          ls kernel/prebuilts | head -20
          ls -l kernel/prebuilts/build-tools/linux_musl-x86/bin/py3-cmd 2>/dev/null || echo NO_MUSL
          ls -l kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel 2>/dev/null || echo NO_BAZEL_BIN
          set +e
          S=$(find $PWD/kernel_platform -maxdepth 7 -type d -name sysroot 2>/dev/null | head -1)
          echo "sysroot source: $S"
          mkdir -p kernel/build/kernel/build-tools
          rm -rf kernel/build/kernel/build-tools/sysroot
          if [ -n "$S" ] && [ -d "$S" ]; then cp -a "$S" kernel/build/kernel/build-tools/sysroot; else echo NO_SYSROOT; fi
          mkdir -p kernel/build/build-tools
          rm -rf kernel/build/build-tools/sysroot
          if [ -n "$S" ] && [ -d "$S" ]; then cp -a "$S" kernel/build/build-tools/sysroot; fi
          set -e
          ls kernel/external | head -15
      - name: A5 apply qqcandy v3d to the Kleaf source tree
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ws"
          exec > >(tee a5.log) 2>&1
          core="$(realpath -e kernel/kernel-6.12)"
          modules="$(realpath -e kernel/kernel_device_modules-6.12)"
          patch="$GITHUB_WORKSPACE/ci-patches/0001-v3d.patch"
          fragment="$GITHUB_WORKSPACE/ci-files/qqcandy-embed.config"
          printf 'Workflow commit %s\nKleaf kernel tree %s\nDevice modules tree %s\n' "$GITHUB_SHA" "$core" "$modules"
          git -C "$core" rev-parse HEAD
          git -C "$modules" rev-parse HEAD
          test "$(realpath -e "$(git -C "$core" rev-parse --show-toplevel)")" = "$core"
          sha256sum "$patch" "$fragment" "$GITHUB_WORKSPACE/ci-files/board-embed.dtb"
          git -C "$core" apply --check --verbose "$patch"
          git -C "$core" apply --verbose "$patch"
          git -C "$core" status --short
          grep -F 'static struct mfdt_ctx ctx __initdata' "$core/arch/arm64/kernel/mtk_embed_merge.c"
          grep -Fx 'config MTK_EMBED_BOARD_DTB' "$core/arch/arm64/Kconfig"
          dtb="$core/arch/arm64/boot/dts/mediatek/qqcandy-merged.dtb"
          install -D -m 644 "$GITHUB_WORKSPACE/ci-files/board-embed.dtb" "$dtb"
          install -m 644 "$fragment" "$modules/kernel/configs/qqcandy-embed.config"
          printf '\nexports_files(["kernel/configs/qqcandy-embed.config"])\n' >> "$modules/BUILD.bazel"
          sha256sum "$core/arch/arm64/kernel/mtk_embed_merge.c" "$dtb"

      - name: B and C build configuration and verify the linked DTB
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ws/kernel"
          package=kernel_device_modules-6.12
          image_target=mgk_64_k612_kernel_aarch64.user
          target="//$package:$image_target"
          flags=(
            --//build/bazel_mgk_rules:kernel_version=6.12
            "--//build/kernel/kleaf:defconfig_fragment=//$package:kernel/configs/qqcandy-embed.config"
          )
          printf 'Target: %s\nBazel option: %s\n' "$target" "${flags[@]}"

          config_action='inputs(".*qqcandy-embed[.]config", mnemonic("^KernelConfig$", '
          ./tools/bazel aquery "${flags[@]}" --include_artifacts=false \
            "$config_action${target}_config))" | tee ../config_action.log
          grep -F 'Mnemonic: KernelConfig' ../config_action.log

          ./tools/bazel build "${flags[@]}" "${target}_config" 2>&1 | tee ../config_build.log
          ./tools/bazel cquery "${flags[@]}" --output=files "${target}_config" | tee ../config_outputs.log
          out_dir="$(awk -v suffix="/$package/${image_target}_config/out_dir" 'substr($0, 1 + length($0) - length(suffix)) == suffix' ../config_outputs.log)"
          test -f "$out_dir/.config"
          cp "$out_dir/.config" ../kernel-config.txt
          grep -E '^(CONFIG_MTK_EMBED|CONFIG_ARCH_MEDIATEK|CONFIG_USB_(MTU3|XHCI_MTK|GADGET|CONFIGFS_F_FS)=|CONFIG_PSTORE_RAM=|# CONFIG_ARCH_MEDIATEK)' ../kernel-config.txt | tee ../config_symbols.log
          while IFS= read -r setting; do
            grep -Fx -- "$setting" ../kernel-config.txt
          done < "$GITHUB_WORKSPACE/ci-files/qqcandy-embed.config"

          image_action='inputs(".*qqcandy-merged[.]dtb", mnemonic("^KernelBuild$", '
          ./tools/bazel aquery "${flags[@]}" --include_artifacts=false \
            "$image_action$target))" | tee ../image_action.log
          grep -F 'Mnemonic: KernelBuild' ../image_action.log

          ./tools/bazel build "${flags[@]}" "$target" 2>&1 | tee ../bazel_build.log
          ./tools/bazel cquery "${flags[@]}" --output=files "$target" | tee ../image_outputs.log
          image="$(awk -v suffix="/$package/$image_target/Image" 'substr($0, 1 + length($0) - length(suffix)) == suffix' ../image_outputs.log)"
          test -f "$image"
          vmlinux="$(dirname "$image")/vmlinux"
          test -f "$vmlinux"
          python3 "$GITHUB_WORKSPACE/ci-files/check_embed.py" "$image" \
            "$GITHUB_WORKSPACE/ci-files/board-embed.dtb" | tee ../embed_check.log
          nm "$vmlinux" | awk '$3 ~ /^_binary_arch_arm64_kernel_board_embed_dtb_(start|end)$/ {print}' | tee ../vmlinux_symbols.log
          grep -q ' _binary_arch_arm64_kernel_board_embed_dtb_start$' ../vmlinux_symbols.log
          grep -q ' _binary_arch_arm64_kernel_board_embed_dtb_end$' ../vmlinux_symbols.log

      - name: first error extraction
        if: always()
        run: |
          cd $RUNNER_TEMP/ws || exit 0
          : > first_error.log
          for f in sync.log a5.log config_build.log bazel_build.log; do
            [ -f "$f" ] || continue
            echo "### $f" >> first_error.log
            ln=$(grep -n -m1 -iE "No such file|ERROR:|error:|couldn.t find|FAILED:" "$f" | cut -d: -f1)
            if [ -n "$ln" ]; then s=$((ln-10)); [ $s -lt 1 ] && s=1; sed -n "${s},$((ln+20))p" "$f" >> first_error.log; else echo "(none)" >> first_error.log; fi
          done
          cat first_error.log

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reno12-logs
          path: |
            ${{ runner.temp }}/ws/*.log
            ${{ runner.temp }}/ws/kernel-config.txt

      - name: upload verified Images
        uses: actions/upload-artifact@v4
        with:
          name: reno12-images
          path: |
            ${{ runner.temp }}/ws/kernel/bazel-bin/kernel_device_modules-6.12/mgk_64_k612_kernel_aarch64.user/Image*
