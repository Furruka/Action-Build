name: Reno12 6.12 baseline (A/B/C)

on:
  workflow_dispatch:
  push:
    branches: [reno12-6.12-baseline]

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      KERNEL_VERSION: kernel-6.12
    defaults:
      run:
        shell: bash
    steps:
      - name: free disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h / | tail -1

      - name: env + repo
        run: |
          set -o pipefail
          nproc; free -g | head -2; df -h / | tail -1
          sudo apt-get update -qq && sudo apt-get install -y -qq git python3 curl unzip zip
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo; echo "$HOME/bin" >> $GITHUB_PATH

      - name: A1 init + local manifest
        run: |
          set -eo pipefail
          mkdir -p $RUNNER_TEMP/ws && cd $RUNNER_TEMP/ws
          repo init -u https://github.com/Numbersf/Kernel_Manifest_Appendix -b oppo/mt6896 -m oppo_reno12_b.xml --depth=1 --no-repo-verify 2>&1 | tail -5
          mkdir -p .repo/local_manifests
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<manifest>'
            echo '  <remove-project name="kernel_platform/prebuilts/asuite" />'
            echo '  <remove-project name="kernel_platform/tools/tradefederation/prebuilts" />'
            echo '</manifest>'
          } > .repo/local_manifests/remove-bad.xml
          cat .repo/local_manifests/remove-bad.xml

      - name: A2 sync
        run: |
          set -o pipefail
          cd $RUNNER_TEMP/ws
          repo sync -c -j8 --no-clone-bundle --no-tags --force-sync 2>&1 | tee sync.log | tail -20
          echo "--- sync errors:"; grep -c "SyncError\|SyncFailFastError" sync.log || true
          df -h / | tail -1; du -sh . | tail -1

      - name: A3 layout + py3-cmd provenance
        run: |
          set -eo pipefail
          cd $RUNNER_TEMP/ws
          for p in kernel kernel-6.12 kernel_platform kernel_platform/common \
                   kernel/kernel_device_modules-6.12 \
                   kernel/prebuilts/build-tools \
                   kernel_platform/prebuilts/kernel-build-tools \
                   kernel_platform/prebuilts/clang/host/linux-x86 \
                   kernel/tools/bazel kernel/build/kernel/kleaf/bazel.origin.sh; do
            [ -e "$p" ] && echo "EXIST   $p" || echo "MISSING $p"
          done | tee layout.log
          find kernel_platform/prebuilts/kernel-build-tools -maxdepth 4 -name py3-cmd 2>/dev/null | head -3 | tee -a layout.log

      - name: A4 prebuilts musl shim
        run: |
          set -eo pipefail
          cd $RUNNER_TEMP/ws
          echo "--- dirs named linux_musl-x86 ---"
          find $PWD -maxdepth 8 -type d -name linux_musl-x86 2>/dev/null | tee find_musl.log || true
          echo "--- files named py3-cmd ---"
          find $PWD -maxdepth 10 -type f -name py3-cmd 2>/dev/null | head -10 | tee -a find_musl.log
          rm -rf kernel/prebuilts/build-tools
          mkdir -p kernel/prebuilts/build-tools
          ln -sfn "$PWD/kernel_platform/prebuilts/build-tools/linux-x86" kernel/prebuilts/build-tools/linux_musl-x86
          ls -l kernel/prebuilts/build-tools/ | tee -a find_musl.log
          kernel/prebuilts/build-tools/linux_musl-x86/bin/py3-cmd -c 'print("PY3CMD_OK")' | tee -a find_musl.log
          # bazel.py wants <ws>/kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel
          ln -sfn "$PWD/kernel_platform/prebuilts/kernel-build-tools" kernel/prebuilts/kernel-build-tools
          ls -l kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel 2>/dev/null | tee -a find_musl.log             || echo "BAZEL_BIN_MISSING" | tee -a find_musl.log
          # kleaf resolves local_repository("external/<x>") relative to the workspace root (kernel/)
          mkdir -p kernel/external
          for d in kernel_platform/external/*; do ln -sfn "$PWD/$d" "kernel/external/$(basename $d)"; done
          ls kernel/external | head -20 | tee -a find_musl.log
          # kleaf loads //build/bazel_common_rules/... from the workspace root
          if [ -d kernel_platform/build/bazel_common_rules ] && [ ! -e kernel/build/bazel_common_rules ]; then
            ln -sfn "$PWD/kernel_platform/build/bazel_common_rules" kernel/build/bazel_common_rules
            echo "linked bazel_common_rules"
          fi
          ls -l kernel/build/ | head -8 | tee -a find_musl.log
          mkdir -p kernel/prebuilts/clang/host
          ln -sfn "$PWD/kernel_platform/prebuilts/clang/host/linux-x86" kernel/prebuilts/clang/host/linux-x86
          ls -l kernel/prebuilts/clang/host/ | tee -a find_musl.log

      - name: B0 bazel diag + query
        run: |
          set -o pipefail
          cd $RUNNER_TEMP/ws/kernel
          {
            echo "--- workspace dotfiles ---"
            ls -la | grep -E '\.bazel|WORKSPACE|MODULE' || true
            echo "--- .bazelversion ---"; cat .bazelversion 2>/dev/null || echo NONE
            echo "--- .bazelrc ---"; cat .bazelrc 2>/dev/null || echo NONE
            echo "--- tools ---"; ls tools 2>/dev/null | head
          } | tee ../bazel_diag.log
          echo "--- bazel prebuilts versions ---" | tee -a ../bazel_diag.log
          ls -l ../kernel_platform/prebuilts/kernel-build-tools/bazel/ 2>/dev/null | tail -5 | tee -a ../bazel_diag.log || true
          echo "--- kernel/external ---" | tee -a ../bazel_diag.log
          ls ../kernel/external 2>/dev/null | head -25 | tee -a ../bazel_diag.log || true
          ./tools/bazel version 2>&1 | tee -a ../bazel_diag.log || true
          FLAGS="--config=internet --enable_bzlmod --//build/bazel_mgk_rules:kernel_version=6.12 --repo_manifest=$PWD/kernel:$PWD/kernel/kernel_device_modules-6.12/fake_manifest.xml"
          echo "official-flags: $FLAGS" | tee -a ../bazel_diag.log
          ./tools/bazel query $FLAGS //kernel_device_modules-6.12:mgk_64_k612_customer_modules_install.user 2>&1 | tail -40 | tee ../bazel_query.log
          if grep -qE "ERROR:|No such file|not defined" ../bazel_query.log; then echo QUERY_FAILED; exit 1; fi
          echo QUERY_OK

      - name: B1 nobuild
        run: |
          set -o pipefail
          cd $RUNNER_TEMP/ws/kernel
          ./tools/bazel build $FLAGS --nobuild //kernel_device_modules-6.12:mgk_64_k612_kernel_aarch64.user 2>&1 | tail -120 | tee ../bazel_nobuild.log
          if grep -qE "ERROR:|No such file" ../bazel_nobuild.log; then echo "NOBUILD_FAILED"; exit 1; fi
          echo NOBUILD_OK

      - name: C build
        run: |
          set -o pipefail
          cd $RUNNER_TEMP/ws/kernel
          ./tools/bazel build $FLAGS -k //kernel_device_modules-6.12:mgk_64_k612_kernel_aarch64.user 2>&1 | tail -200 | tee ../bazel_build.log
          find bazel-bin/kernel_device_modules-6.12 -maxdepth 4 -name 'Image*' -type f -exec ls -l {} \; | tee ../image_list.log
          find bazel-bin/kernel_device_modules-6.12 -maxdepth 4 -name 'Image*' -type f -exec md5sum {} \; | tee -a ../image_list.log
          if ! grep -q 'Image' ../image_list.log; then echo 'NO_IMAGE_PRODUCED'; exit 1; fi
          if grep -qE "ERROR:" ../bazel_build.log; then echo BUILD_FAILED; exit 1; fi

      - name: first error extraction
        if: always()
        run: |
          cd $RUNNER_TEMP/ws || exit 0
          : > first_error.log
          for f in sync.log bazel_query.log bazel_nobuild.log bazel_build.log; do
            [ -f "$f" ] || continue
            echo "### $f" >> first_error.log
            ln=$(grep -n -m1 -iE "No such file|ERROR:|error:|couldn.t find|FAILED:" "$f" | cut -d: -f1)
            if [ -n "$ln" ]; then s=$((ln-10)); [ $s -lt 1 ] && s=1; sed -n "${s},$((ln+20))p" "$f" >> first_error.log; else echo "(none)" >> first_error.log; fi
          done
          cat first_error.log

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reno12-logs
          path: |
            ${{ runner.temp }}/ws/*.log
            ${{ runner.temp }}/ws/layout.log

      - name: upload images
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reno12-images
          path: |
            ${{ runner.temp }}/ws/kernel/bazel-bin/kernel_device_modules-6.12/**/*.ko
            ${{ runner.temp }}/ws/kernel/bazel-bin/kernel_device_modules-6.12/**/Image*